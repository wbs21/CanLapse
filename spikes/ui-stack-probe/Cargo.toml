[package]
name = "ui-stack-probe"
version = "0.1.0"
edition = "2021"
publish = false

# 探针：只为实测 egui/eframe 这条路线在本机（离线）的可行性、体积、依赖与中文渲染。
# 用默认 features（eframe 0.36 默认走 glow/OpenGL 后端，不是 wgpu）。
[[bin]]
name = "ui_stack_probe"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
rfd = "0.17"

[workspace]
