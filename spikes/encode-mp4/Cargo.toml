[package]
name = "encode-mp4-spike"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Offline spike: in-memory BGRA frames -> H.264 MP4 using D:\\CapLite\\ffmpeg-min via hand-written FFI"

[[bin]]
name = "encode-mp4-spike"
path = "src/main.rs"

# ZERO dependencies on purpose: `cargo build --offline` cannot fail on registry
# resolution, and no crate from the local cache is required.
[dependencies]

[workspace]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
