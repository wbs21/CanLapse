[package]
name = "canlapse"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "面向手绘创作者的 Windows 画布窗口缩时录屏工具"
license = "MIT"
publish = false

[[bin]]
name = "canlapse-cli"
path = "src/main.rs"

# 图形界面入口：windows 子系统，双击不弹控制台黑框。
#
# 命名注意：Windows 文件名**大小写不敏感**，一旦 CLI 也叫 canlapse，
# `CanLapse.exe` 与 `canlapse.exe` 就是同一个文件、会互相覆盖
# （实测踩过：一直跑的都是 CLI，GUI 入口根本没生效）。所以两个名字必须真正不同。
[[bin]]
name = "CanLapse"
path = "src/bin/canlapse-gui.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
