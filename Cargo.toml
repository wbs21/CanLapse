[package]
name = "canlapse"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "面向手绘创作者的 Windows 画布窗口缩时录屏工具"
license = "MIT"
publish = false

[[bin]]
name = "canlapse"
path = "src/main.rs"

# 图形界面入口：windows 子系统，双击不弹控制台黑框。
#
# ⚠️ 名字**不能**叫 `CanLapse` —— Windows 文件名大小写不敏感，
# `CanLapse.exe` 与 `canlapse.exe` 是同一个文件，会把命令行入口覆盖掉
# （这个坑实测踩过：一直跑的都是 CLI，GUI 入口根本没生效）。
[[bin]]
name = "CanLapseGUI"
path = "src/bin/canlapse-gui.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
